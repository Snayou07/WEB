<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yummy Cinema - Користувачі</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">
            <span class="logo-box">YC</span>
            <span class="logo-text">YUMMY <span class="text-red">CINEMA</span></span>
        </a>

        <nav class="nav-menu">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-film"></i> Фільми</a>
            <a href="users.html" class="nav-link active"><i class="fa-solid fa-users"></i> Користувачі</a>
        </nav>

        <div class="auth-buttons">
            <button class="btn-submit" style="width: auto; padding: 5px 15px;">Admin</button>
        </div>
    </div>
</header>

<div class="container main-layout">

    <main class="content">
        <div class="section-header">
            <h2><i class="fa-solid fa-users text-red"></i> Список користувачів</h2>
        </div>
        <div id="loading" class="loading">Завантаження...</div>

        <div id="usersGrid" class="users-grid"></div>
    </main>

    <aside class="sidebar">
        <div class="widget">
            <div class="widget-header">
                <h3 id="formTitle"><i class="fa-solid fa-user-plus"></i> Створити користувача</h3>
            </div>
            <div class="widget-body">
                <form id="userForm">
                    <input type="hidden" id="userId">

                    <div class="form-group">
                        <label>Username (Логін)</label>
                        <input type="text" id="username" required placeholder="User123">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="example@mail.com">
                    </div>

                    <button type="submit" id="submitBtn" class="btn-submit">СТВОРИТИ</button>
                    <button type="button" id="cancelBtn" class="btn-cancel" style="display: none;">СКАСУВАТИ</button>
                </form>
            </div>
        </div>


    </aside>
</div>

<script src="users.js"></script>
</body>
</html>
